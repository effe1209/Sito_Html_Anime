<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b14">
  <meta name="description" content="Galleria fotografica di Los Hombres.">
  <title>Hot Pics | Los Hombres</title>
  <link rel="stylesheet" href="site.css">
  <script src="site.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#contenuto">Salta al contenuto</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">LOS <span>HOMBRES</span></a>
      <nav class="site-nav" aria-label="Navigazione principale">
        <a href="index.html">Home</a>
        <a href="Anime.html">Anime</a>
        <a href="DataBase.html">DataBase</a>
        <a href="Giotto!.html">Giotto!</a>
        <a href="HOT.html" aria-current="page">Hot Pics</a>
        <a href="Los%20Hombres.html">Novelle</a>
      </nav>
    </div>
  </header>
  <main id="contenuto" class="page-shell">
    <section class="hero">
      <p class="eyebrow">Galleria</p>
      <h1>Hot Pics</h1>
      <p>Inserisci la password per accedere alla galleria.</p>
    </section>
    <form id="hotpics-password-form" class="panel password-form" data-password-gate>
      <label for="hotpics-password">Password</label>
      <input id="hotpics-password" name="password" type="password" autocomplete="current-password" required aria-describedby="hotpics-password-error">
      <button type="submit">Accedi</button>
      <p id="hotpics-password-error" class="password-error" aria-live="polite"></p>
    </form>
    <noscript><p class="panel">Per accedere alla galleria è necessario attivare JavaScript.</p></noscript>
    <div id="hotpics-content" class="gallery gallery-single" hidden>
      <h2 class="visually-hidden" tabindex="-1">Galleria Hot Pics</h2>
      <img src="tutti.jpeg" alt="Foto di gruppo" width="1024" height="768" fetchpriority="high">
      <img src="ok.jpeg" alt="Foto della raccolta" width="970" height="1296" loading="lazy" decoding="async">
      <img src="dux.jpeg" alt="Foto della raccolta" width="1024" height="768" loading="lazy" decoding="async">
    </div>
  </main>
  <footer class="site-footer">A cura di Los Hombres</footer>
</body>
</html>
